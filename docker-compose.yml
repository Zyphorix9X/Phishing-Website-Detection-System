services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: phishing_db
      POSTGRES_USER: phishing_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishing_app -d phishing_db"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      AUTO_CREATE_DB: "false"
      DATABASE_URL: postgresql+psycopg://phishing_app:${POSTGRES_PASSWORD}@db:5432/phishing_db
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      BACKGROUND_ANALYSIS_ENABLED: "true"
      LEGACY_SQLITE_PATH: /legacy/phishing_detection.db
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - ./phishing_detection.db:/legacy/phishing_detection.db:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      AUTO_CREATE_DB: "false"
      DATABASE_URL: postgresql+psycopg://phishing_app:${POSTGRES_PASSWORD}@db:5432/phishing_db
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      BACKGROUND_ANALYSIS_ENABLED: "true"
      LEGACY_SQLITE_PATH: /legacy/phishing_detection.db
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    command: ["celery", "-A", "celery_worker.celery", "worker", "--loglevel=INFO", "--concurrency=2", "--max-tasks-per-child=100"]
    volumes:
      - ./phishing_detection.db:/legacy/phishing_detection.db:ro
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
